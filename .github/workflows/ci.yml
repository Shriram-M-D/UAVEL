name: ci
# B1: test only the folders that changed, so one person's PR never waits on another person's suite.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shriram: ['shriram/**', 'docs/**']
            shreyas: ['shreyas/**']
            mrinal: ['mrinal/**']
            prajwal: ['prajwal/**']

  python-tests:
    needs: changes
    if: needs.changes.outputs.folders != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJSON(needs.changes.outputs.folders) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU torch (keeps CI fast)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install folder requirements
        run: pip install -r ${{ matrix.folder }}/requirements.txt
      - name: Test
        working-directory: ${{ matrix.folder }}
        run: |
          if [ -d tests ] && ls tests/*.py >/dev/null 2>&1; then python -m pytest -q tests; else echo "no tests yet"; fi
